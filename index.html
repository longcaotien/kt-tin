<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Tin học 11 – HK1 (15 phút)</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#14231c;--mut:#5a6d63;--line:#d3dfd8;--pcb:#0f3d2e;--gold:#d9b44a;--ok:#0b8a57;--okb:#d9f4e6;--no:#cc3b3b;--nob:#fde6e6;--hov:#f1f7f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--card:#14211b;--ink:#e6f0ea;--mut:#8fa69a;--line:#26382f;--pcb:#0a2a20;--ok:#3fd18f;--okb:#12392a;--no:#ff7676;--nob:#3b1b1b;--hov:#1a2b23}}
:root[data-theme="dark"]{--bg:#0c1511;--card:#14211b;--ink:#e6f0ea;--mut:#8fa69a;--line:#26382f;--pcb:#0a2a20;--ok:#3fd18f;--okb:#12392a;--no:#ff7676;--nob:#3b1b1b;--hov:#1a2b23}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--pcb);color:#f3f7f4;padding:36px 20px 44px;position:relative;
background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1px,transparent 1.5px);background-size:18px 18px}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 16px)}
.w{max-width:760px;margin:0 auto}
h1{font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
header p{margin:0;opacity:.85;max-width:52ch}
.bits{font:700 12px "JetBrains Mono",monospace;color:var(--gold);opacity:.8;margin-bottom:14px;letter-spacing:.12em;overflow:hidden;white-space:nowrap}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px}
.bar .w{display:flex;align-items:center;gap:14px}
.trk{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
#fill{height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .4s cubic-bezier(.3,.8,.3,1)}
.st{font:700 13px "JetBrains Mono",monospace;white-space:nowrap}
.st i{font-style:normal;color:var(--ok)}.st u{text-decoration:none;color:var(--no)}
.rb{font:600 13px inherit;font-family:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .2s}
.rb:hover{background:var(--hov)}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-bottom:16px;border-left:6px solid var(--line);transition:border-color .35s}
.q.ok{border-left-color:var(--ok)}.q.no{border-left-color:var(--no)}
.q h2{font-size:16.5px;font-weight:500;margin:0 0 12px;line-height:1.5}
.q h2 b{font-weight:800;color:var(--ok);margin-right:4px}
.fig{margin:4px 0 14px;padding:10px;background:var(--hov);border-radius:10px;text-align:center;color:var(--ink)}
.fig svg{width:100%;max-width:340px;height:auto}
.fig small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;transition:background .25s,border-color .25s,transform .15s}
.o:hover{background:var(--hov);border-color:var(--mut)}
.o:active{transform:scale(.99)}
.o:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.o b{flex:none;width:28px;height:28px;border-radius:7px;background:var(--line);display:grid;place-items:center;font:700 13px "JetBrains Mono",monospace;transition:background .25s,color .25s}
.o span{padding-top:2px}
.q.done .o{cursor:default}.q.done .o:hover{background:transparent;border-color:var(--line)}
.q.done .o.right{background:var(--okb);border-color:var(--ok);animation:pop .4s}
.q.done .o.right b{background:var(--ok);color:#fff}
.q.done .o.wrong{background:var(--nob);border-color:var(--no);animation:shake .4s}
.q.done .o.wrong b{background:var(--no);color:#fff}
.q.done .o:not(.right):not(.wrong){opacity:.55}
.fb{max-height:0;overflow:hidden;font-weight:700;font-size:14px;transition:max-height .35s,margin .35s}
.q.done .fb{max-height:40px;margin-top:12px}
.q.ok .fb{color:var(--ok)}.q.no .fb{color:var(--no)}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#res{display:none;background:var(--pcb);color:#f3f7f4;border-radius:14px;padding:26px 20px;text-align:center;border-bottom:12px solid var(--gold)}
#res.show{display:block;animation:pop .5s}
#res big{display:block;font:800 52px "JetBrains Mono",monospace;color:var(--gold)}
#res .rb{color:#fff;border-color:rgba(255,255,255,.4);margin-top:14px;padding:9px 16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="w"><div class="bits">01001001 01010100 · 10010 = 101 + 1101</div>
<h1>Ôn tập Tin học 11</h1>
<p>Đề ôn kiểm tra 15 phút, học kì 1. 30 câu trắc nghiệm: chạm vào đáp án để biết đúng hay sai ngay.</p></div></header>
<div class="bar"><div class="w"><div class="trk"><div id="fill"></div></div>
<div class="st" id="st">0/30</div><button class="rb" id="rs">Làm lại</button></div></div>
<main id="m"></main>
<script>
var ram=function(y){var s='<rect x="10" y="'+y+'" width="340" height="46" rx="3" fill="#1f8a3b"/>';for(var i=0;i<8;i++)s+='<rect x="'+(34+i*38)+'" y="'+(y+8)+'" width="28" height="22" rx="2" fill="#16181a"/>';return s+'<rect x="10" y="'+(y+40)+'" width="340" height="6" fill="#d9b44a"/><rect x="170" y="'+(y+38)+'" width="5" height="8" fill="#1f8a3b"/>'};
var G='<svg viewBox="0 0 140 70" role="img" aria-label="Ký hiệu cổng logic hai đầu vào A, B và đầu ra F" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 22H40M4 48H40M97 35H132"/><path d="M40 10H72A25 25 0 0 1 72 60H40Z" fill="rgba(128,128,128,.12)"/><g fill="currentColor" stroke="none" font-family="sans-serif" font-size="12" font-weight="700"><text x="6" y="16">A</text><text x="6" y="43">B</text><text x="122" y="29">F</text></g></svg><small>Cổng logic hai đầu vào A, B và đầu ra F</small>';
var R='<svg viewBox="0 0 360 114" role="img" aria-label="Hình hai thanh bo mạch xanh có chip đen và chân tiếp xúc vàng">'+ram(6)+ram(60)+'</svg><small>Hình ảnh bộ phận của máy tính</small>';
var Q=[
["Ký hiệu cổng logic trong hình dưới đây là cổng logic nào?",["AND","OR","NOT","XOR"],0,G],
["Hãy sắp xếp thứ tự ưu tiên khi chọn mua máy tính để thực hiện các công việc thông thường:<br>1. Ổ cứng dung lượng lớn.<br>2. RAM dung lượng lớn.<br>3. CPU tốc độ cao.",["1, 2, 3","2, 1, 3","3, 2, 1","3, 1, 2"],2],
["Hãy cho biết hình ảnh dưới đây là bộ phận nào của máy tính?",["CPU","ROM","RAM","SSD"],2,R],
["CPU là viết tắt của từ Tiếng Anh nào sau?",["Control Processing Unit.","Central Processing Unit.","Central Person Unit.","Computer Processing Unit."],1],
["CPU là gì?",["Trung tâm điều khiển máy tính.","Bộ xử lý trung tâm của máy tính.","Bộ điều khiển máy tính.","Hệ điều hành."],1],
["CPU làm nhiệm vụ gì?",["Là thiết bị thực hiện các chương trình tính toán.","Là thiết bị chính thực hiện và điều khiển việc thực hiện các chương trình.","Là thân máy tính, chứa các thiết bị phần cứng bên trong nó.","Là toàn bộ máy tính."],1],
["Cho biểu thức logic “A AND B” và “A OR B”. Với A=0 và B=0, giá trị của 2 biểu thức logic lần lượt là:",["0; 0.","0; 1.","1; 0.","1; 1."],0],
["Cho biểu thức logic “A AND B” và “A OR B”. Với A=1 và B=0, giá trị của 2 biểu thức logic lần lượt là:",["0; 0.","0; 1.","1; 0.","1; 1."],1],
["Kết quả của phép toán nhị phân 101+1101 là bao nhiêu:",["10001.","10100.","10010.","11000."],2],
["Máy tính tính toán được là vì sao?",["Có các mạch logic.","Được lập trình sẵn.","Có CPU.","Có mạch điều khiển tự động."],0],
["Khi tắt máy hoặc khởi động lại, dữ liệu trong bộ phận nào sau đây mất đi?",["Ổ cứng HDD/ SSD.","RAM.","ROM.","CPU."],1],
["Có thể đánh giá hiệu năng của máy tính thông qua yếu tố nào sau đây?",["Độ sắc nét của camera.","Tốc độ của CPU.","Kích thước của màn hình.","ROM và RAM."],1],
["Tần số đồng hồ xung của CPU thường sử dụng đơn vị nào để đánh giá tốc độ của CPU?",["MB","GB","GHz","TB"],2],
["Hai bộ phận chính cấu tạo nên Bộ xử lý trung tâm (CPU) là gì?",["Thanh ghi và bộ nhớ đệm","Bộ số học và lôgic (ALU) và Bộ điều khiển (CU)","Bộ nhớ RAM và bộ nhớ ROM","Đĩa cứng và đĩa thể rắn (SSD)"],1],
["Trong bảng cộng nhị phân 1 bit, phép cộng 1 + 1 cho kết quả bằng bao nhiêu?",["0","1","2","10 (viết 0, nhớ 1)"],3],
["Phần mềm thương mại là gì?",["Phần mềm không phải trả phí.","Phần mềm phải trả phí để sử dụng.","Phần mềm chỉ sử dụng trực tuyến.","Phần mềm khai thác trực tuyến."],1],
["Phần mềm thương mại thường là loại phần mềm nào?",["Phần mềm nguồn đóng.","Phần mềm nguồn mở.","Phần mềm miễn phí.","Phần mềm khai thác trực tuyến."],0],
["Loại phần mềm nào hầu hết được cung cấp dưới dạng nguồn đóng nhằm bảo vệ ý tưởng và chống sửa đổi?",["Phần mềm thương mại (commercial software)","Phần mềm nguồn mở (open-source software)","Phần mềm tự do (free software)","Phần mềm chạy trên Internet"],0],
["Giấy phép phần mềm nguồn mở nào hiện nay được áp dụng rộng rãi nhất?",["Giấy phép thương mại độc quyền","Giấy phép Acrobat Reader","Giấy phép công cộng GNU GPL","Giấy phép phần mềm đặt hàng"],2],
["Phần mềm nguồn mở là gì?",["Phần mềm mà người dùng phải trả phí để sử dụng.","Phần mềm mà người dùng có thể sử dụng miễn phí và có thể xem mã nguồn.","Phần mềm chỉ có thể sử dụng trực tuyến và không cài đặt trên máy tính.","Trình chiếu."],1],
["Giấy phép phần mềm công cộng (GNU GPL) đảm bảo điều gì?",["Tự do khai thác, nghiên cứu, sửa đổi và chia sẻ phần mềm.","Chỉ cho phép sử dụng phần mềm trên môi trường Web.","Yêu cầu người dùng phải trả phí để sử dụng phần mềm.","Yêu cầu người dùng cài đặt trên máy tính."],0],
["Phần mềm khai thác trực tuyến có đặc điểm gì?",["Chỉ sử dụng được trên môi trường Web và có phí.","Chỉ sử dụng được trên môi trường Web và miễn phí.","Có thể cài đặt trên máy tính và sử dụng miễn phí.","Chỉ sử dụng được trên môi trường Web và có thể có phí hoặc miễn phí."],3],
["Khái niệm \"phần mềm chạy trên Internet\" (phần mềm trực tuyến) được hiểu là gì?",["Phần mềm cho phép sử dụng qua Internet mà không cần phải cài đặt vào máy","Phần mềm thương mại bắt buộc phải cài đặt trực tiếp vào ổ đĩa cứng","Phần mềm nguồn mở chỉ dành riêng cho lập trình viên","Phần mềm chỉ hoạt động khi không có kết nối mạng"],0],
["Hệ điều hành nguồn mở nào là hệ điều hành dùng cho hầu hết các dòng điện thoại thông minh (trừ iPhone, iPad)?",["iOS","Windows","Android","macOS"],2],
["Phần mềm thương mại được chia thành hai loại chính nào?",["Phần mềm trả phí và phần mềm miễn phí","Phần mềm \"đặt hàng\" (máy-đo) và phần mềm \"đóng gói\"","Phần mềm trực tuyến và phần mềm ngoại tuyến","Phần mềm hệ thống và phần mềm ứng dụng"],1],
["Ứng dụng trực tuyến Google Docs giúp người dùng thực hiện công việc nào?",["Lập bảng tính trực tuyến","Soạn thảo văn bản trực tuyến","Trình chiếu trực tuyến","Quản trị cơ sở dữ liệu"],1],
["Đáp án nào dưới đây là phần mềm thương mại?",["Inkscape","GIMP","Microsoft Word","Môi trường lập trình cho ngôn ngữ Python"],2],
["Phần mềm nào có thể thay thế hệ điều hành Windows?",["Android","Writer","LINUX","My SQL"],2],
["Để sử dụng các phần mềm trực tuyến của Google (Google Docs, Sheets, Slides), người dùng cần có điều kiện gì?",["Phải mua bản quyền trả phí hằng tháng","Cần có tài khoản Google và thiết bị có kết nối Internet","Phải tải mã nguồn phần mềm về cài đặt","Cần cài đặt sẵn phần mềm Microsoft Office trên máy"],1],
["Khi người dùng tạo và chỉnh sửa văn bản trên các phần mềm trực tuyến của Google, văn bản đó sẽ được tự động lưu trữ ở đâu?",["Trên đĩa mềm của máy tính","Trên không gian lưu trữ đám mây của Google","Trên bộ nhớ ROM của thiết bị","Trên thẻ nhớ SD cắm ngoài"],1]
];
var m=document.getElementById("m"),L="ABCD",done=0,good=0;
m.innerHTML=Q.map(function(q,i){return '<section class="q" id="q'+i+'"><h2><b>Câu '+(i+1)+'.</b> '+q[0]+'</h2>'+(q[3]?'<div class="fig">'+q[3]+'</div>':'')+q[1].map(function(o,j){return '<button class="o" data-q="'+i+'" data-o="'+j+'"><b>'+L[j]+'</b><span>'+o+'</span></button>'}).join('')+'<div class="fb"></div></section>'}).join('')+'<div id="res"><big id="sc"></big><div id="sm"></div><button class="rb" id="rs2">Làm lại từ đầu</button></div>';
function upd(){document.getElementById("fill").style.width=done/Q.length*100+"%";document.getElementById("st").innerHTML='<i>'+good+'</i> đúng · <u>'+(done-good)+'</u> sai · '+done+'/'+Q.length;
if(done==Q.length){var r=document.getElementById("res");document.getElementById("sc").textContent=good+"/"+Q.length;document.getElementById("sm").textContent=good==Q.length?"Tuyệt đối! Bạn trả lời đúng tất cả.":good>=Q.length*.8?"Rất tốt, xem lại các câu sai để chắc hơn.":"Cuộn lên xem các câu sai rồi làm lại nhé.";r.classList.add("show");setTimeout(function(){r.scrollIntoView({behavior:"smooth",block:"center"})},500)}}
m.addEventListener("click",function(e){var b=e.target.closest(".o");if(!b)return;var i=+b.dataset.q,j=+b.dataset.o,s=document.getElementById("q"+i);if(s.classList.contains("done"))return;
var a=Q[i][2],os=s.querySelectorAll(".o");s.classList.add("done");os[a].classList.add("right");done++;
if(j==a){good++;s.classList.add("ok");s.querySelector(".fb").textContent="✓ Chính xác!"}else{os[j].classList.add("wrong");s.classList.add("no");s.querySelector(".fb").textContent="✗ Chưa đúng. Đáp án đúng là "+L[a]+"."}upd()});
function reset(){done=good=0;document.querySelectorAll(".q").forEach(function(s){s.className="q";s.querySelectorAll(".o").forEach(function(o){o.className="o"});s.querySelector(".fb").textContent=""});document.getElementById("res").classList.remove("show");upd();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("rs").onclick=reset;document.getElementById("rs2").onclick=reset;upd();
</script></body></html>
